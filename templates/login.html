<!DOCTYPE html> <!-- Declares the document as HTML5 -->
<html lang="en"> <!-- Sets the document language to English -->
<head> <!-- Begins page metadata -->
    <meta charset="UTF-8"> <!-- Sets the page character encoding --> <!-- Character set -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Adapts the page to phone screens --> <!-- Fits phone screens -->
    <title>Log In | Pharma Stock Tracker</title> <!-- Sets the browser tab title --> <!-- Browser tab text -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Loads Bootstrap 5 components and utilities --> <!-- Bootstrap -->
    <link href="../static/css/style.css" rel="stylesheet"> <!-- Loads the shared project stylesheet --> <!-- Our CSS (../ = up one folder, then into static/css) -->
</head> <!-- Ends page metadata -->
<body class="dashboard-page"> <!-- Applies the shared dashboard visual theme -->
    <header class="dashboard-header"> <!-- Provides the shared dark navigation header -->
        <nav class="navbar navbar-expand-md"> <!-- Creates the responsive Bootstrap navbar without a toggle --> <!-- Same links on every page -->
            <div class="container"> <!-- Aligns navigation content to the page container -->
                <div class="navbar-nav flex-row flex-wrap gap-2"> <!-- Keeps navigation links in a row that wraps on small screens -->
                    <a class="nav-link" href="dashboard.html">Dashboard</a> <!-- Links to the dashboard -->
                    <a class="nav-link" href="receive.html">Receive Stock</a> <!-- Links to stock receiving -->
                    <a class="nav-link" href="dispense.html">Dispense</a> <!-- Links to dispensing -->
                    <a class="nav-link" href="alerts.html">Alerts</a> <!-- Links to reorder alerts -->
                    <a class="nav-link" href="forecast.html">Forecast</a> <!-- Links to demand forecasts -->
                    <a class="nav-link" href="expiry_risk.html">Expiry Risk</a> <!-- Links to expiry risk -->
                    <a class="nav-link" href="kpi.html">KPIs</a> <!-- Links to key performance indicators -->
                    <a class="nav-link active" href="login.html" aria-current="page">Log In</a> <!-- Marks the current page in the navbar -->
                </div> <!-- Ends the navigation links -->
            </div> <!-- Ends the navigation container -->
        </nav> <!-- Ends the shared navbar -->
    </header> <!-- Ends the shared page header -->
    <main class="container dashboard-main"> <!-- Centers the page content and applies shared spacing -->
        <section class="card dashboard-intro mb-4"> <!-- Places the page introduction in a Bootstrap card -->
            <div class="card-body"> <!-- Adds Bootstrap card content spacing -->
                <h1 class="mb-2">Log In</h1> <!-- Shows the page heading -->
                <p class="mb-0">Pharmacy staff log in to record stock. Only pharmacists can approve orders.</p> <!-- Preserves the login information -->
            </div> <!-- Ends the introduction card body -->
        </section> <!-- Ends the introduction card -->
        <section class="card mb-4"> <!-- Places the login form in a Bootstrap card -->
            <div class="card-body"> <!-- Adds Bootstrap card content spacing -->
                <form action="#" method="post"> <!-- Preserves the login form action and method -->
                    <div class="mb-3"> <!-- Groups the username label and control -->
                        <label class="form-label" for="username">Username</label> <!-- Labels the username field -->
                        <input class="form-control" type="text" id="username" name="username" required> <!-- Styles the username field and preserves its attributes -->
                    </div> <!-- Ends the username field group -->
                    <div class="mb-3"> <!-- Groups the password label and control -->
                        <label class="form-label" for="password">Password</label> <!-- Labels the password field -->
                        <input class="form-control" type="password" id="password" name="password" required> <!-- Styles the password field and preserves its attributes -->
                    </div> <!-- Ends the password field group -->
                    <button class="btn btn-primary" type="submit">Log in</button> <!-- Styles the login submit button -->
                </form> <!-- Ends the login form -->
            </div> <!-- Ends the login form card body -->
        </section> <!-- Ends the login form card -->
    </main> <!-- Ends the page content -->
    <footer class="site-footer"> <!-- Applies the shared footer styling -->
        <p class="mb-0">BFB 321 - Pharmaceutical Stock Level Tracker</p> <!-- Preserves the project footer text -->
    </footer> <!-- Ends the page footer -->
</body> <!-- Ends the page body -->
</html> <!-- Ends the HTML document -->
