<!DOCTYPE html>                                              <!-- HTML5 page -->
<html lang="en">                                             <!-- Language: English -->
<head>
    <meta charset="UTF-8">                                   <!-- Character set (so symbols like α display) -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Fits phone screens -->
    <title>{% block title %}Pharma Stock Tracker{% endblock %}</title>   <!-- Each page can replace this tab title -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/logo-mark.svg') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- 1st: Bootstrap styling -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"> <!-- 2nd: OUR style.css from static/css (after Bootstrap so ours wins) -->
</head>
<body class="{% block body_class %}app-page{% endblock %}">

    <header class="app-header">                              <!-- REUSABLE NAVBAR: written once, shown on every page -->
        <nav class="navbar navbar-expand-lg navbar-dark">     <!-- Dark navigation bar -->
            <div class="container-fluid app-nav-container">  <!-- Full-width container -->
                <button class="menu-toggle" type="button" data-menu-toggle aria-label="Open navigation menu" aria-controls="side-menu" aria-expanded="false">
                    <span aria-hidden="true"></span>
                </button>
                <a class="navbar-brand" href="/dashboard">Pharma Stock Tracker</a>
                <div class="app-top-links">
                    <a class="nav-link" data-auth-toggle href="/login">Log In</a>
                </div>
            </div>
        </nav>
    </header>
    <div class="side-menu-backdrop" data-menu-backdrop aria-hidden="true"></div>
    <aside class="side-menu" id="side-menu" data-side-menu aria-label="Main navigation" aria-hidden="true">
        <div class="side-menu-header">
            <h2 class="side-menu-title">Navigation</h2>
            <button class="side-menu-close" type="button" data-menu-close aria-label="Close navigation menu">&times;</button>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link" href="/dashboard">Dashboard</a>
            <a class="nav-link" href="/receive">Receive Stock</a>
            <a class="nav-link" href="/dispense">Dispense</a>
            <a class="nav-link" href="/alerts">Alerts</a>
            <a class="nav-link" href="/forecast">Forecast</a>
            <a class="nav-link" href="/expiry-risk">Expiry Risk</a>
            <a class="nav-link" href="/kpis">KPIs</a>
        </nav>
    </aside>

    <main class="container app-main">
        {% block content %}{% endblock %}                    <!-- Each page's own content is placed here -->
    </main>

    <footer class="site-footer">                             <!-- REUSABLE FOOTER: styled by .site-footer in style.css -->
        BFB 321 - Pharmaceutical Stock Level Tracker
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap's own script (powers the pop-up on the Alerts page later) -->
    <script src="{{ url_for('static', filename='js/auth-nav.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
</body>
</html>
