<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pharmaceutical Stock Level Tracker{% endblock %}</title>

    <!-- Bootstrap (styling) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Pharma Stock Tracker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" href="/receive">Receive Stock</a></li>
                        <li class="nav-item"><a class="nav-link" href="/dispense">Dispense</a></li>
                        <li class="nav-item"><a class="nav-link" href="/alerts">Alerts</a></li>
                        <li class="nav-item"><a class="nav-link" href="/forecast">Forecast</a></li>
                        <li class="nav-item"><a class="nav-link" href="/expiry-risk">Expiry Risk</a></li>
                        <li class="nav-item"><a class="nav-link" href="/kpi">KPIs</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-3">
        BFB 321 · Pharmaceutical Stock Level Tracker
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
