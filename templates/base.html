<!DOCTYPE html>                                              <!-- HTML5 page -->
<html lang="en">                                             <!-- Language: English -->
<head>
    <meta charset="UTF-8">                                   <!-- Character set (so symbols like α display) -->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- Fits phone screens -->
    <title>{% block title %}Pharma Stock Tracker{% endblock %}</title>   <!-- Each page can replace this tab title -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- 1st: Bootstrap styling -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"> <!-- 2nd: OUR style.css from static/css (after Bootstrap so ours wins) -->
</head>
<body>

    <header>                                                 <!-- REUSABLE NAVBAR: written once, shown on every page -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">     <!-- Dark navigation bar -->
            <div class="container-fluid">                    <!-- Full-width container -->
                <a class="navbar-brand" href="/">Pharma Stock Tracker</a>  <!-- App name; links to the dashboard -->
                <ul class="navbar-nav flex-row flex-wrap gap-3">           <!-- Links in a row; wrap onto a new line on phones -->
                    <li class="nav-item"><a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a></li>                         <!-- "active" highlights the page you're on -->
                    <li class="nav-item"><a class="nav-link {% if request.path == '/receive' %}active{% endif %}" href="/receive">Receive Stock</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/dispense' %}active{% endif %}" href="/dispense">Dispense</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/alerts' %}active{% endif %}" href="/alerts">Alerts</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/forecast' %}active{% endif %}" href="/forecast">Forecast</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/expiry-risk' %}active{% endif %}" href="/expiry-risk">Expiry Risk</a></li>
                    <li class="nav-item"><a class="nav-link {% if request.path == '/kpi' %}active{% endif %}" href="/kpi">KPIs</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container my-4">                            <!-- Centred content area with space above and below -->
        {% block content %}{% endblock %}                    <!-- Each page's own content is placed here -->
    </main>

    <footer class="site-footer">                             <!-- REUSABLE FOOTER: styled by .site-footer in style.css -->
        BFB 321 · Pharmaceutical Stock Level Tracker
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap's own script (powers the pop-up on the Alerts page later) -->
</body>
</html>
