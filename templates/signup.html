{% extends "base.html" %}

{% block title %}Sign Up | Pharma Stock Tracker{% endblock %}

{% block content %}
    <section class="card app-intro page-intro mb-4">
        <div class="card-body">
            <h1 class="mb-2">Sign Up</h1>
            <p class="mb-0">Create an account to use the Pharma Stock Tracker.</p>
        </div>
    </section>
    <section class="card mb-4">
        <div class="card-body">
            <form action="#" method="post">
                <div class="mb-3">
                    <label class="form-label" for="full-name">Full name</label>
                    <input class="form-control" type="text" id="full-name" name="full_name" autocomplete="name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm-password">Confirm password</label>
                    <input class="form-control" type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Sign up</button>
            </form>
            <p class="mt-3 mb-0"><a href="/login">Back to log in</a></p>
        </div>
    </section>
{% endblock %}
