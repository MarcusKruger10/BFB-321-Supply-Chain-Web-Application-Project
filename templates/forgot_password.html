{% extends "base.html" %}

{% block title %}Forgot Password | Pharma Stock Tracker{% endblock %}

{% block content %}
    <section class="card app-intro page-intro mb-4">
        <div class="card-body">
            <h1 class="mb-2">Forgot Password?</h1>
            <p class="mb-0">Enter your username or email and we’ll send a reset link.</p>
        </div>
    </section>
    <section class="card mb-4">
        <div class="card-body">
            <form action="#" method="post">
                <div class="mb-3">
                    <label class="form-label" for="account">Username or email</label>
                    <input class="form-control" type="text" id="account" name="account" autocomplete="username" required>
                </div>
                <button class="btn btn-primary" type="submit">Send reset link</button>
            </form>
            <p class="mt-3 mb-0"><a href="/login">Back to log in</a></p>
        </div>
    </section>
{% endblock %}
