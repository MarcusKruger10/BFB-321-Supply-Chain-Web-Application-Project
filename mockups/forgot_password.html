<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Send Reset Link | Pharma Stock Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card fade">
    <div class="auth-head">
      <div class="logo"><i class="fa-solid fa-key"></i></div>
      <h1>Send Reset Link</h1>
      <p>Enter your username or email and we’ll send a reset link.</p>
    </div>
    <div class="auth-body">
      <form action="#" method="post">
        <div class="field"><label for="ac">Username or email</label><input id="ac" type="text" autocomplete="username" required></div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:4px">Send Reset Link</button>
      </form>
      <div class="auth-links"><a href="login.html">Back to log in</a></div>
    </div>
  </div>
</div>
<script>document.querySelectorAll('.fade').forEach(function(el){el.classList.add('in');});</script>
</body>
</html>
