<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | Pharma Stock Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card fade">
    <div class="auth-head">
      <div class="logo"><i class="fa-solid fa-user-plus"></i></div>
      <h1>Sign Up</h1>
      <p>Create an account to use the Pharma Stock Tracker.</p>
    </div>
    <div class="auth-body">
      <form action="#" method="post">
        <div class="field"><label for="fn">Full name</label><input id="fn" type="text" autocomplete="name" required></div>
        <div class="field"><label for="un">Username</label><input id="un" type="text" autocomplete="username" required></div>
        <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" required></div>
        <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="new-password" required></div>
        <div class="field"><label for="cpw">Confirm password</label><input id="cpw" type="password" autocomplete="new-password" required></div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:4px">Sign Up</button>
      </form>
      <div class="auth-links"><a href="login.html">Back to log in</a></div>
    </div>
  </div>
</div>
<script>document.querySelectorAll('.fade').forEach(function(el){el.classList.add('in');});</script>
</body>
</html>
