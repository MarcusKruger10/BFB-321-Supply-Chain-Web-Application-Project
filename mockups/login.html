<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log In | Pharma Stock Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card fade">
    <div class="auth-head">
      <div class="logo"><i class="fa-solid fa-capsules"></i></div>
      <h1>Log In</h1>
      <p>Pharmacy staff log in to record stock. Only pharmacists can approve orders.</p>
    </div>
    <div class="auth-body">
      <form action="#" method="post">
        <div class="field"><label for="u">Username</label><input id="u" type="text" required></div>
        <div class="field"><label for="p">Password</label><input id="p" type="password" required></div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:4px">Log In</button>
      </form>
      <div class="auth-links"><a href="forgot_password.html">Forgot password?</a><a href="signup.html">Sign up</a></div>
    </div>
  </div>
</div>
<script>document.querySelectorAll('.fade').forEach(function(el){el.classList.add('in');});</script>
</body>
</html>
